<!DOCTYPE html>
<html>
<head>
    <title>Excel Visualizer</title>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            background:linear-gradient(
                135deg,
                #0f172a,
                #1e293b,
                #0f172a
            );
            color:white;
        }

        .navbar{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 50px;
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(10px);
            border-bottom:1px solid rgba(255,255,255,0.1);
        }

        .logo{
            font-size:28px;
            font-weight:bold;
            background:linear-gradient(
                90deg,
                #38bdf8,
                #8b5cf6
            );
            -webkit-background-clip:text;
            -webkit-text-fill-color:transparent;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:auto;
            padding:40px 0;
        }

        .card{
            background:rgba(255,255,255,0.05);
            backdrop-filter:blur(15px);
            border-radius:20px;
            padding:30px;
            box-shadow:
            0 8px 32px rgba(0,0,0,.3);
            animation:fadeIn 0.8s ease;
        }

        .btn{
            display:inline-block;
            padding:12px 24px;
            border:none;
            border-radius:12px;
            text-decoration:none;
            color:white;
            cursor:pointer;
            font-weight:600;
            transition:.3s;
        }

        .btn:hover{
            transform:
            translateY(-4px)
            scale(1.05);

            box-shadow:
            0 0 20px rgba(255,255,255,.3);
        }

        .btn-primary{
            background:#3b82f6;
        }

        .btn-success{
            background:#22c55e;
        }

        .btn-danger{
            background:#ef4444;
        }

        .btn-purple{
            background:#8b5cf6;
        }

        input,
        select{
            width:100%;
            padding:14px;
            margin-top:10px;
            margin-bottom:20px;
            border:none;
            border-radius:10px;
            background:rgba(255,255,255,0.08);
            color:white;
        }

        table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        table th,
        table td{
            padding:12px;
            border:1px solid rgba(255,255,255,.1);
        }

        table th{
            background:#1e293b;
        }

        img{
            max-width:100%;
            border-radius:15px;
        }

        .bg-circle{
            position:fixed;
            border-radius:50%;
            filter:blur(120px);
            opacity:.25;
            z-index:-1;
        }

        .circle1{
            width:300px;
            height:300px;
            background:#8b5cf6;
            top:-100px;
            left:-100px;
        }

        .circle2{
            width:350px;
            height:350px;
            background:#38bdf8;
            bottom:-100px;
            right:-100px;
        }

        .chart-card{

            text-align:center;

            padding:30px;

            font-size:22px;

            border-radius:15px;

            background:
            rgba(255,255,255,.05);

            transition:.4s;

            cursor:pointer;
        }

        .chart-card:hover{

            transform:
            translateY(-8px)
            scale(1.05);

            background:
            rgba(255,255,255,.1);

            box-shadow:
            0 0 25px
            rgba(59,130,246,.4);
        }

        .stats-grid{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(250px,1fr));

            gap:20px;

            margin-bottom:30px;
        }

        .stat-card{

            background:
            rgba(255,255,255,.05);

            padding:30px;

            border-radius:20px;

            text-align:center;

            transition:.4s;
        }

        .stat-card:hover{

            transform:
            translateY(-8px);

            box-shadow:
            0 0 25px
            rgba(59,130,246,.4);
        }

        .stat-card h2{

            font-size:40px;

            color:#38bdf8;

            margin-bottom:10px;
        }

        .gallery{

            display:grid;

            grid-template-columns:
            repeat(auto-fit,minmax(380px,1fr));

            gap:30px;
        }

        .history-card{

            background:
            rgba(255,255,255,.05);

            border-radius:25px;

            overflow:hidden;

            transition:.4s;

            position:relative;
        }

        .history-card:hover{

            transform:
            translateY(-10px);

            box-shadow:
            0 0 35px
            rgba(139,92,246,.4);
        }

        .chart-image{

            width:100%;

            height:280px;

            object-fit:cover;

            transition:.5s;
        }

        .history-card:hover .chart-image{

            transform:scale(1.05);
        }

        .card-content{

            padding:25px;
        }

        .badge{

            position:absolute;

            top:15px;

            right:15px;

            background:#8b5cf6;

            color:white;

            padding:8px 15px;

            border-radius:30px;

            font-size:14px;

            font-weight:bold;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .title{

    font-size:42px;

            background:
            linear-gradient(
                90deg,
                #38bdf8,
                #8b5cf6
            );

            -webkit-background-clip:text;

            -webkit-text-fill-color:transparent;

            margin-bottom:20px;
        }
        table{

            width:100%;

            border-collapse:collapse;

            overflow:hidden;

            border-radius:15px;
        }

        table th{

            background:#2563eb;

            color:white;

            padding:15px;
        }

        table td{

            padding:12px;

            background:
            rgba(255,255,255,.04);
        }

        table tr:hover{

            background:
            rgba(255,255,255,.08);
        }

    input[type=text],
    input[type=password],
    input[type=email],
    select{
        width:100%;
        padding:15px;
        border:none;
        border-radius:12px;
        background:#374151;
        color:white;
        font-size:16px;
    }

    select option{
        background:white;
        color:black;
    }
    input:focus{

        border:1px solid #38bdf8;

        box-shadow:
        0 0 15px
        rgba(56,189,248,.4);
    }
    .dashboard-btn{

        width:100%;

        border:none;

        border-radius:20px;

        padding:30px;

        font-size:24px;

        font-weight:600;

        cursor:pointer;

        transition:.4s;

        color:white;

        background:
        rgba(255,255,255,.05);

        backdrop-filter:blur(15px);
    }

    .dashboard-btn:hover{

        transform:
        translateY(-8px);

        box-shadow:
        0 0 30px
        rgba(59,130,246,.4);
    }

    .logout-btn{

        background:
        linear-gradient(
        135deg,
        #ef4444,
        #dc2626
        );
    }

    .logout-btn:hover{

        box-shadow:
        0 0 30px
        rgba(239,68,68,.6);
    }

    

    </style>

</head>

<body>

<div class="navbar">

    <div class="logo">
        📊 Excel Visualizer
    </div>

    <div>

        <a href="/"
           class="btn btn-primary">
            Dashboard
        </a>

        <a href="/upload/"
           class="btn btn-success">
            Upload
        </a>

        <a href="/history/"
           class="btn btn-purple">
            History
        </a>

    </div>

</div>

<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
