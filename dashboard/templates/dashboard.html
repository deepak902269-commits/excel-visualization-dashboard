{% extends 'base.html' %}

{% block content %}

<div class="card">

<h1 class="title">
    📊 Excel Visualization Dashboard
</h1>

<p style="
color:#94a3b8;
font-size:18px;
margin-bottom:30px;
">

Upload datasets, generate charts,
and download professional visualizations.

</p>

<div style="
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(250px,1fr));
gap:20px;
">

<a href="/upload/"
class="btn btn-success"
style="
padding:30px;
font-size:22px;
text-align:center;
">
📁 Upload Dataset
</a>

<a href="/history/"
class="btn btn-purple"
style="
padding:30px;
font-size:22px;
text-align:center;
">
📈 View History
</a>

<form action="/accounts/logout/" method="post">

    {% csrf_token %}

    <button
        type="submit"
        class="dashboard-btn logout-btn">

        <span style="font-size:40px;">🚪</span>

        <br><br>

        Logout

    </button>

</form>

</div>

</div>

{% endblock %}
